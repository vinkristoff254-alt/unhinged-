<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a15">
<title>Unhinged</title>
<style>
:root{--felt:#12261f;--felt2:#0b1a15;--card:#f4ecd8;--ink:#1d1611;--red:#c23b22;--brass:#c9a45c;--mute:#9db3a8;--tx:#efe7d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0,#1d3d32 0,var(--felt) 50%,var(--felt2) 100%) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 16px 48px}
.hd{display:flex;justify-content:space-between;align-items:center}
.wm{font:italic 800 22px/1 Georgia,"Noto Serif",serif;color:var(--brass)}.wm i{color:var(--red);font-style:normal}
.code{font:700 13px system-ui;letter-spacing:3px;color:var(--mute);border:1px solid rgba(201,164,92,.4);border-radius:6px;padding:4px 8px}
h1{font:800 30px/1.1 Georgia,"Noto Serif",serif;margin:18px 0 4px;letter-spacing:-.3px}
.sub{color:var(--mute);margin:0 0 6px}
.mute{color:var(--mute);font-size:14px;margin:10px 0 0}
.pnl{background:rgba(0,0,0,.26);border:1px solid rgba(201,164,92,.28);border-radius:12px;padding:16px;margin:14px 0}
.pnl h2{font:700 20px/1.2 Georgia,"Noto Serif",serif;margin:0 0 10px}
.pnl h2 small{font:500 13px system-ui;color:var(--mute);margin-left:8px}
button{font:600 16px system-ui,sans-serif;color:var(--tx);background:transparent;border:1px solid rgba(239,231,211,.35);border-radius:10px;padding:12px 16px;min-height:50px;cursor:pointer;width:100%;margin:6px 0}
button:active{transform:scale(.98)}
button.go{background:var(--red);border-color:var(--red);color:#fff}
button.br{background:var(--brass);border-color:var(--brass);color:var(--ink)}
button.on{border-color:var(--brass);background:rgba(201,164,92,.16);color:#f2dca3}
button.ln{border:0;background:none;color:var(--mute);text-decoration:underline;min-height:44px}
button:disabled{opacity:.4}
button.sm{width:auto;min-height:38px;padding:6px 12px;margin:0;font-size:14px;flex:none}
button.tg{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px}
button.pb{display:flex;align-items:center;gap:8px;text-align:left}
input{width:100%;font:500 17px system-ui;color:var(--tx);background:var(--felt2);border:1px solid rgba(239,231,211,.3);border-radius:10px;padding:12px}
input::placeholder{color:#6f877b}
.row{display:flex;gap:8px;align-items:center}
.row3{display:grid;gap:6px}.row3 button{margin:0;padding:10px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(239,231,211,.12)}
.nm{flex:1;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 15px Georgia,serif;color:#fff;background:var(--c);border:2px dashed rgba(255,255,255,.55);flex:none}
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:18px 20px 44px;margin:16px 0;min-height:230px;position:relative;outline:1px solid rgba(29,22,17,.2);outline-offset:-8px;box-shadow:0 12px 26px rgba(0,0,0,.5),0 2px 3px rgba(0,0,0,.5)}
.card::after{content:attr(data-s);position:absolute;right:22px;bottom:14px;font-size:26px;transform:rotate(180deg)}
.card[data-s="â™¥"]::after,.card[data-s="â™¦"]::after,.card[data-s="â™¥"] .pip,.card[data-s="â™¦"] .pip{color:var(--red)}
.pip{font:600 14px system-ui;opacity:.8;margin-bottom:14px}
.q{font:700 27px/1.2 Georgia,"Noto Serif",serif}
.card.dk{background:var(--ink);color:var(--tx);min-height:0;padding-bottom:22px;outline-color:rgba(201,164,92,.5)}
.card.dk .pip{color:var(--brass)}.card.dk .q{font-size:21px}
.stamp{position:absolute;right:18px;top:14px;border:3px solid var(--red);color:var(--red);font:800 20px Georgia,serif;padding:2px 10px;border-radius:6px;transform:rotate(-10deg);animation:thump .35s ease-out}
.card.still .stamp{animation:none}
@keyframes thump{from{transform:rotate(-10deg) scale(2.2);opacity:0}}
.flip{animation:flip .6s cubic-bezier(.2,.7,.2,1)}
@keyframes flip{from{transform:perspective(800px) rotateY(-80deg);opacity:0}}
.turn{display:flex;align-items:center;gap:10px;font:700 19px Georgia,"Noto Serif",serif;margin:14px 0 0}
.deck{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:0 8px 18px rgba(0,0,0,.45);outline:1px solid rgba(29,22,17,.2);outline-offset:-7px}
.deck b{display:block;font:700 22px Georgia,"Noto Serif",serif}.deck span{font-size:14px;opacity:.75}
.deck .su{font:44px/1 Georgia,serif;width:44px;text-align:center;opacity:1}.deck.r .su{color:var(--red)}
.deck:nth-of-type(odd){transform:rotate(-.8deg)}.deck:nth-of-type(even){transform:rotate(.8deg)}
.bar{height:8px;border-radius:4px;background:var(--brass);margin-top:6px}
.sc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(239,231,211,.12)}
.sc .rk{font:italic 700 16px Georgia,serif;color:var(--mute);width:20px}
.sc .pt{font:800 26px Georgia,serif;color:var(--brass);text-align:right}
.sc small{display:block;font:500 12px system-ui;color:var(--mute)}
.toast{position:fixed;left:14px;right:14px;bottom:24px;background:var(--ink);color:var(--tx);border:1px solid var(--brass);border-radius:10px;padding:14px;font-weight:600;text-align:center;z-index:9}
#cf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#cf i{position:absolute;top:-20px;width:8px;height:14px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><div id="cf"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>Math.random().toString(36).slice(2,10);
const me=localStorage.getItem('ug_id')||(()=>{const v=uid()+uid();localStorage.setItem('ug_id',v);return v})();
let R=localStorage.getItem('ug_room'),D=null,ref=null,U={},nick=localStorage.getItem('ug_name')||'',busy=0;
const LV={chill:'Chill',spicy:'Spicy',unhinged:'Unhinged'},PTS={chill:1,spicy:2,unhinged:3};
const GN={dod:'Do or Drink',mlt:'Most Likely To',nhie:'Never Have I Ever'},SH={dod:'Dares',mlt:'Most Likely',nhie:'Never Have I'};
const SU={dod:'â™ ',mlt:'â™¥',nhie:'â™¦'},DS={dod:'A dare or a question. Do it or take the forfeit.',mlt:'Vote in secret. The room decides.',nhie:'Confess together and keep count.'};
const HINT={dod:'Type a dare or question, e.g. Sing a song about the person on your left.',mlt:'Finish the sentence "Most likely to..." e.g. adopt ten cats.',nhie:'Finish the sentence "Never have I ever..." e.g. walked into a glass door.'};
const AC=['#a8362a','#2f6b4f','#2e4e7a','#7a4e8a','#b07d2a','#3d6f73'];
const HD=()=>`<div class="hd"><span class="wm">Unhinged<i>.</i></span>${R?`<span class="code">${R}</span>`:''}</div>`;
if(typeof firebase==='undefined'||typeof FB_CONFIG==='undefined'||!/^https:/.test(FB_CONFIG.databaseURL||'')){
 A.innerHTML=HD()+'<h1>Cannot start</h1><p class="sub">Check that config.js holds your Firebase values (databaseURL must start with https://) and that this phone is online.</p>';throw new Error('setup')}
firebase.initializeApp(FB_CONFIG);const db=firebase.database();
const P={
dod:{chill:["Do your best impression of someone in this room.","Sing the chorus of any song, loudly.","Talk like a news anchor until your next turn.","Do your best runway walk.","Say something nice about the people on your left and right."],
spicy:["Tell us your most embarrassing school moment.","Confess a harmless lie you told this week.","Tell someone here what you honestly admire about them.","Name your guilty pleasure song and sing a bit.","Describe your worst date, no names."],
unhinged:["Narrate the next minute of the room like a nature documentary.","Invent a handshake with the person on your right and perform it.","Argue that a spoon beats a fork for 30 seconds.","Speak only in questions until your next turn.","Defend a ridiculous conspiracy theory about pigeons."]},
mlt:{chill:["be late to their own birthday party.","get lost even with GPS on.","adopt ten cats.","fall asleep at the party.","survive a zombie apocalypse."],
spicy:["text their ex at 2am.","cry at a movie advert.","get us kicked out of a restaurant.","ghost the group chat for a month.","start drama and watch."],
unhinged:["become a cult leader.","marry a stranger in Vegas.","start a viral scandal by accident.","ask a ghost for life advice.","turn out to be a spy."]},
nhie:{chill:["walked into a glass door.","sent a text to the wrong person.","eaten food that fell on the floor.","talked to myself in public.","forgotten a name right after hearing it."],
spicy:["stalked someone online for an hour.","lied about my age.","pretended to be sick to skip plans.","cried at work or school.","sent a message I instantly regretted."],
unhinged:["hidden in a closet.","argued with a bird.","snuck out of a window.","given a fake name to a stranger.","eaten something from a fridge that was not mine."]}};
const PEN=["Do your best chicken impression for 10 seconds.","Speak in a posh accent until your next turn.","Compliment the person on your left.","Do 5 jumping jacks.","Let the group give you a silly nickname for the night.","Hold a dramatic pose until the next player starts."];

const rf=p=>db.ref('rooms/'+R+(p?'/'+p:''));
const isHost=()=>D&&D.host===me,ids=()=>Object.keys(D.players||{}),pl=i=>(D.players||{})[i]||{n:'?',s:0,h:0};
const gl=()=>Object.keys(GN).filter(k=>D.g&&D.g[k]);
const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
const av=i=>`<span class="av" style="--c:${AC[[...i].reduce((a,c)=>a+c.charCodeAt(0),0)%6]}">${esc((pl(i).n||'?')[0].toUpperCase())}</span>`;
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let ac;const beep=(f=520)=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.1)}catch(e){}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function confetti(){const c=$('#cf'),cl=['#c23b22','#c9a45c','#f4ecd8','#2f6b4f'];for(let i=0;i<40;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cl[i%4];e.style.animationDelay=Math.random()*.5+'s';e.style.transform='rotate('+Math.random()*360+'deg)';c.appendChild(e);setTimeout(()=>e.remove(),3200)}}
const cnt=i=>{const o=(D.prompts||{})[i]||{};return ['dod','mlt','nhie'].reduce((a,k)=>a+(o[k]||[]).length,0)};
const board=()=>Object.entries(D.players).sort((a,b)=>(b[1].s||0)-(a[1].s||0)).map(([i,p],k)=>`<div class="sc"><span class="rk">${k+1}</span>${av(i)}<span class="nm">${esc(p.n)}<small>${p.h||0} confession${(p.h||0)==1?'':'s'}</small></span><span class="pt">${p.s||0}</span></div>`).join('');
function an(g,s){const f=g.n!=U.ln?' flip':'',t=(g.n+'|'+s)!=U.ls?'':' still';U.ln=g.n;U.ls=g.n+'|'+s;U.ch=!t;return f+t}
function pool(g){const c=[];Object.entries(D.prompts||{}).forEach(([i,o])=>(o[g]||[]).forEach(t=>c.push({t,a:i})));return (D.bi||!c.length)?c.concat(P[g][D.lvl].map(t=>({t,a:null}))):c}
function draw(g,avoid){const p=pool(g);let u=(D.used&&D.used[g])||[],a=p.filter(x=>!u.includes(x.t));if(!a.length){a=p;u=[]}
 const b=avoid?a.filter(x=>x.a!==avoid):a,x=pick(b.length?b:a);rf('used/'+g).set(u.concat(x.t));return x.t}

/* ---------- entry ---------- */
function home(){
 A.innerHTML=`${HD()}<h1>Your phone, your cards.</h1><p class="sub">Everyone plays on their own phone. One person creates a room and the rest join with its code.</p>
 <div class="pnl"><h2>Your name</h2><input id="nm" maxlength="14" placeholder="Name" value="${esc(nick)}"></div>
 <button class="go" id="mk">Create a room</button>
 <div class="pnl"><h2>Join a room</h2><div class="row"><input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px"><button class="sm" id="jn">Join</button></div></div>`;
 const who=()=>{const v=$('#nm').value.trim();if(!v){toast('Enter your name first');return null}nick=v;localStorage.setItem('ug_name',v);return v};
 on('#mk',async()=>{const n=who();if(!n)return;let c;do{c=[...Array(4)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('')}while((await db.ref('rooms/'+c).once('value')).exists());
  R=c;await rf().set({host:me,phase:'lobby',lvl:'chill',bi:true,drink:false,g:{dod:1,mlt:1,nhie:1},players:{[me]:{n,s:0,h:0}}});enter()});
 on('#jn',async()=>{const n=who(),c=$('#cd').value.trim().toUpperCase();if(!n||c.length!=4)return;
  const s=await db.ref('rooms/'+c).once('value');if(!s.exists())return toast('Room not found');
  const ps=s.val().players||{};
  if(!ps[me]){if(Object.keys(ps).length>=15)return toast('Room is full');if(Object.values(ps).some(p=>p.n.toLowerCase()==n.toLowerCase()))return toast('That name is taken');await db.ref('rooms/'+c+'/players/'+me).set({n,s:0,h:0})}
  R=c;enter()})}
function enter(){localStorage.setItem('ug_room',R);if(ref)ref.off();ref=rf();ref.on('value',onVal)}
function leave(){if(ref){ref.off();ref=null}R=null;D=null;U={};localStorage.removeItem('ug_room');home()}
function onVal(s){D=s.val();if(!D){toast('Room closed');leave();return}if(!(D.players&&D.players[me])){leave();return}render();if(isHost())hostLogic()}
function render(){if(!D)return;const ae=document.activeElement,id=ae&&ae.id,val=ae&&ae.value;
 if(U.v=='mine')mine();else if(D.phase=='lobby')lobby();else play();
 const e=id&&$('#'+id);if(e&&e.tagName=='INPUT'){e.value=val;e.focus()}}
const leaveBtn=()=>on('#lv',()=>{if(isHost()){if(confirm('You are the host. Leaving closes the room for everyone.'))rf().remove()}else{rf('players/'+me).remove();leave()}});

/* ---------- lobby ---------- */
function lobby(){const h=isHost(),ps=ids();
 A.innerHTML=`${HD()}<div class="card" data-s="â™ "><div class="pip">â™  Room code</div><div class="q" style="font-size:54px;letter-spacing:8px">${R}</div><p class="mute">Friends open the same page and join with this code.</p></div>
 <div class="pnl"><h2>At the table<small>${ps.length} of 15</small></h2>${ps.map(i=>`<div class="pr">${av(i)}<span class="nm">${esc(pl(i).n)}${i==D.host?' Â· host':''}</span>${i==me?`<button class="sm" id="mp">My prompts ${cnt(i)}</button>`:`<span class="mute" style="margin:0">${cnt(i)} prompts</span>`}</div>`).join('')}</div>
 ${h?`<div class="pnl"><h2>Tonight's games</h2>${Object.keys(GN).map(k=>`<button class="tg ${D.g[k]?'on':''}" data-gm="${k}"><span>${SU[k]} ${GN[k]}</span><span>${D.g[k]?'On':'Off'}</span></button>`).join('')}
 <button class="tg ${D.bi?'on':''}" id="bi"><span>House prompts</span><span>${D.bi?'Mixed in':'Backup only'}</span></button></div>
 <div class="pnl"><h2>How far tonight?</h2><div class="row3" style="grid-template-columns:repeat(3,1fr)">${Object.keys(LV).map(k=>`<button data-l="${k}" class="${D.lvl==k?'on':''}">${LV[k]}</button>`).join('')}</div></div>
 <div class="pnl"><h2>Drink penalty</h2><button class="tg ${D.drink?'on':''}" id="dr"><span>Offer a sip when someone passes</span><span>${D.drink?'On':'Off'}</span></button><p class="mute">Never required. Water, soda or a silly forfeit always works.</p></div>
 <button class="go" id="st" ${ps.length<3?'disabled':''}>Deal the first hand</button>`
 :`<div class="pnl"><h2>Tonight</h2><p class="mute" style="margin-top:0">${gl().map(k=>GN[k]).join(', ')} Â· ${LV[D.lvl]} Â· Drink penalty ${D.drink?'on':'off'}</p></div><p class="mute">Waiting for the host to start. Add your prompts while you wait.</p>`}
 <button class="ln" id="lv">Leave room</button>`;
 on('#mp',()=>{U.v='mine';render()});leaveBtn();
 A.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{const k=b.dataset.gm;if(D.g[k]&&gl().length<2)return;rf('g/'+k).set(D.g[k]?0:1)});
 A.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>rf('lvl').set(b.dataset.l));
 on('#bi',()=>rf('bi').set(!D.bi));on('#dr',()=>rf('drink').set(!D.drink));
 on('#st',()=>{const u={phase:'play',game:null,used:null,tq:null};ids().forEach(i=>{u['players/'+i+'/s']=0;u['players/'+i+'/h']=0});buzz(40);rf().update(u)})}

/* ---------- my prompts ---------- */
function mine(){const G=gl();U.g=G.includes(U.g)?U.g:(G[0]||'dod');const g=U.g,L=((D.prompts||{})[me]||{})[g]||[];
 A.innerHTML=`${HD()}<h1>Your prompts</h1><p class="sub">Up to 10 per game. They get shuffled in with everyone else's, and nobody sees who wrote what.</p>
 <div class="row3" style="grid-template-columns:repeat(${G.length},1fr);margin-top:12px">${G.map(k=>`<button data-g="${k}" class="${k==g?'on':''}">${SH[k]} ${(((D.prompts||{})[me]||{})[k]||[]).length}</button>`).join('')}</div>
 <div class="pnl"><p class="mute" style="margin-top:0">${HINT[g]}</p><div class="row" style="margin-top:10px"><input id="qi" maxlength="120" placeholder="Prompt ${Math.min(L.length+1,10)} of 10"><button class="sm" id="qa" ${L.length>=10?'disabled':''}>Add</button></div>
 <button class="ln" id="qs">${U.show?'Hide':'Show'} what I wrote</button>${U.show?L.map((t,j)=>`<div class="pr"><span class="nm">${esc(t)}</span><button class="sm" data-x="${j}">Ã—</button></div>`).join(''):''}</div>
 <button class="go" id="bk">Done</button>`;
 A.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{U.g=b.dataset.g;render()});
 const add=()=>{let v=$('#qi').value.trim();if(!v||L.length>=10)return;v=v.replace(/^(most likely to|never have i ever)\s*/i,'');$('#qi').value='';beep(660);rf('prompts/'+me+'/'+g).set(L.concat(v))};
 on('#qa',add);$('#qi').onkeydown=e=>e.key=='Enter'&&add();
 on('#qs',()=>{U.show=!U.show;render()});
 A.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>rf('prompts/'+me+'/'+g).set(L.filter((_,j)=>j!=+b.dataset.x)));
 on('#bk',()=>{U.v=null;render()})}

/* ---------- play ---------- */
function play(){const g=D.game,h=isHost();U.bind=null;let body;
 if(!g){body=h?`<h1>Pick a deck.</h1><p class="sub">${LV[D.lvl]} tonight, ${ids().length} at the table.</p>${gl().map(k=>`<button class="deck ${k=='dod'?'':'r'}" data-k="${k}"><span class="su">${SU[k]}</span><div><b>${GN[k]}</b><span>${DS[k]}</span></div></button>`).join('')}${gl().length>1?'<button class="br" id="rg">Deal me in, random deck</button>':''}`
  :'<h1>Shufflingâ€¦</h1><p class="sub">The host is picking a deck.</p>';
  U.bind=()=>{const G={dod:startDod,mlt:startMlt,nhie:startNhie};A.querySelectorAll('[data-k]').forEach(b=>b.onclick=G[b.dataset.k]);on('#rg',()=>G[pick(gl())]())}}
 else body=({dod:dodV,mlt:mltV,nhie:nhieV})[g.k](g,h);
 A.innerHTML=`${HD()}${body}<div class="pnl"><h2>Scores</h2>${board()}</div><div class="row"><button class="ln" id="mp">My prompts</button><button class="ln" id="lv">Leave room</button></div>`;
 if(U.bind)U.bind();on('#mp',()=>{U.v='mine';render()});leaveBtn();
 if(g&&U.ch&&((g.k=='dod'&&g.r==1)||(g.k!='dod'&&g.st=='res')))confetti()}

function startDod(){let q=(D.tq||[]).filter(i=>D.players[i]);if(!q.length)q=shuf(ids());const pid=q.pop();rf().update({tq:q,game:{k:'dod',n:Date.now(),pid,t:draw('dod',pid),r:0}})}
function dodV(g,h){const mt=g.pid==me,n=PTS[D.lvl],c=an(g,g.r||0),tp=pl(g.pid),r=g.r||0;
 U.bind=()=>{
  on('#do',()=>{rf('players/'+me+'/s').transaction(v=>(v||0)+n);rf('game/r').set(1);beep(880);buzz(60)});
  on('#ps',()=>{rf('game').update({r:2,pen:(D.drink?'Take a sip (water or soda counts), or do this instead: ':'')+pick(PEN)});beep(260);buzz(30)});
  on('#dw',()=>rf('game').update({t:draw('dod',g.pid),n:Date.now()}));
  on('#nx',startDod);on('#bm',()=>rf('game').remove())};
 return `<p class="turn">${av(g.pid)}<span>${mt?'You are up.':esc(tp.n)+' is up.'}</span></p>
